[package]
name = "demagog-rs"
version = "0.1.2"
edition = "2024"
license = "MIT"
description = "Text and dictionary processor for TTS (FishAudio Drama3 / ComfyUI)"

[dependencies]
eframe = "0.31"
egui = "0.31"
egui_extras = { version = "0.31", features = ["all_loaders"] }
rfd = "0.15"
rayon = "1.10"
regex = "1.11"
rustc-hash = "2.1"
encoding_rs = "0.8"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
arboard = "3.4"

[features]
default = []
wgpu = ["eframe/wgpu"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

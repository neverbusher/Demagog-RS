[package]
name = "demagog-rs"
version = "0.1.3"
edition = "2024"
license = "MIT"
description = "Text and dictionary processor for TTS (FishAudio Drama3 / ComfyUI)"

[dependencies]
eframe = { version = "0.34", optional = true, default-features = false, features = ["accesskit", "default_fonts", "glow"] }
egui = "0.34"
egui_extras = { version = "0.34", features = ["all_loaders"] }
egui_software_backend = { version = "0.0.3", optional = true }
rfd = "0.15"
rayon = "1.10"
regex = "1.11"
rustc-hash = "2.1"
encoding_rs = "0.8"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
arboard = "3.4"

[features]
default = ["eframe-backend"]
eframe-backend = ["dep:eframe"]
sw = ["dep:egui_software_backend"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
